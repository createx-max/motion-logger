[platformio]
src_dir = firmware/motion_logger

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
upload_port = COM7
monitor_port = COM7
upload_speed = 921600
monitor_speed = 115200

; LittleFS is optional: it lets the sketch keep its unsent queue across a power
; cut. Uncomment both lines here AND the littlefs block in motion_logger.ino to
; switch it on; the default build stays flash-free.
;board_build.filesystem = littlefs
;build_flags = -D USE_LITTLEFS
